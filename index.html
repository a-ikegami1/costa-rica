<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Costa Rica — Postcards for You</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Caveat:wght@500;600;700&family=DM+Mono:wght@400;500&family=Kalam:wght@400;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <main>
    <section id="intro" class="intro" aria-label="Open the envelope">
      <div class="mini-envelope mini-a"><img src="assets/envelope.png" alt=""></div><div class="mini-envelope mini-b"><img src="assets/envelope.png" alt=""></div>
      <p class="tiny-note">a little something from Costa Rica</p>
      <button id="envelopeButton" class="envelope-wrap" aria-label="Open the envelope">
        <span class="click-hint">click the envelope to open it ✦</span>
        <span class="envelope">
          <img src="assets/envelope.png" alt="A cream envelope addressed as a Costa Rica postcard" />
        </span>
      </button>
    </section>

    <section id="postcards" class="postcards" aria-hidden="true">
      <div class="postcard-header">
        <span class="stamp-line">✈ COSTA RICA / 2026</span>
        <h1>postcards for you &lt;3</h1>
        <p>click a postcard to turn it over</p>
      </div>
      <div id="cardGrid" class="card-grid"></div>
      <div class="footer-note">i love you and miss you daniel &lt;3</div>
    </section>
  </main>
  <script src="script.js"></script>
</body>
</html>
